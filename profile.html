<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e94560">
  <title>Mon Profil — Akrya</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
/* ════════════════════════════════════════════
   VARIABLES & RESET
════════════════════════════════════════════ */
:root {
  --primary:       #e94560;
  --primary-dark:  #c72e48;
  --primary-light: #ff6b8b;
  --primary-glow:  rgba(233,69,96,.18);
  --bg:        #07070e;
  --bg-card:   #111120;
  --bg-hover:  #1a1a2e;
  --bg-input:  #14142a;
  --text:      #efefff;
  --text-muted:#7777aa;
  --border:    #22223a;
  --radius:    18px;
  --radius-sm: 10px;
  --shadow:    0 8px 32px rgba(0,0,0,.5);
  --shadow-glow: 0 0 24px rgba(233,69,96,.12);
}
body.light-theme {
  --bg:      #f2f2fa;
  --bg-card: #ffffff;
  --bg-hover:#e8e8f4;
  --bg-input:#eeeef8;
  --text:    #1a1a30;
  --text-muted:#6666aa;
  --border:  #d0d0e8;
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .35s, color .35s;
  line-height: 1.5;
}
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background: var(--bg-card); }
::-webkit-scrollbar-thumb { background: var(--primary); border-radius:3px; }

/* ════ HEADER ════ */
header {
  background: linear-gradient(135deg, #030308 0%, #0d0d1e 100%);
  padding: .85rem 2rem;
  position: sticky; top:0; z-index:200;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
}
body.light-theme header { background: linear-gradient(135deg,#eeeef8,#f8f8ff); }
.hdr { display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; }
.home-link {
  color: var(--primary); text-decoration:none; font-weight:700;
  display:inline-flex; align-items:center; gap:.4rem; font-size:.92rem;
  transition: color .2s;
}
.home-link:hover { color: var(--primary-light); }
.hdr-title { font-size:1.05rem; font-weight:700; flex:1; }
.hdr-right { margin-left:auto; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }

.icon-btn {
  background: var(--bg-hover); border:1px solid var(--border); border-radius:50%;
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:.95rem; color:var(--text); transition:all .2s;
}
.icon-btn:hover { background:var(--primary); border-color:var(--primary); }

.hdr-auth { display:flex; gap:.4rem; }
.hdr-g { background:#4285f4; color:#fff; border:none; border-radius:40px; padding:.38rem .95rem; cursor:pointer; font-weight:600; font-size:.78rem; transition:all .2s; }
.hdr-f { background:#1877f2; color:#fff; border:none; border-radius:40px; padding:.38rem .95rem; cursor:pointer; font-weight:600; font-size:.78rem; transition:all .2s; }
.hdr-g:hover,.hdr-f:hover { filter:brightness(1.1); transform:translateY(-1px); }
.hdr-user { display:flex; align-items:center; gap:.5rem; background:var(--bg-hover); padding:.28rem .7rem .28rem .35rem; border-radius:40px; border:1px solid var(--border); font-size:.78rem; }
.hdr-avatar { width:26px; height:26px; border-radius:50%; object-fit:cover; border:2px solid var(--primary); }
.hdr-logout { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:.8rem; transition:color .2s; }
.hdr-logout:hover { color:var(--primary); }

/* ════ CONTAINER ════ */
.cont { max-width:1120px; margin:0 auto; padding:2rem; }

/* ════ PAS CONNECTÉ ════ */
.not-logged {
  text-align:center; padding:6rem 2rem;
  animation: fadeUp .5s ease;
}
.nl-illustration { font-size:5rem; margin-bottom:1.5rem; filter:drop-shadow(0 4px 16px rgba(233,69,96,.3)); }
.not-logged h2 { font-size:2rem; font-weight:800; margin-bottom:.7rem; }
.not-logged p { color:var(--text-muted); max-width:440px; margin:0 auto 2.5rem; }
.nl-btns { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
.nl-g { background:#4285f4; color:#fff; border:none; border-radius:50px; padding:.85rem 2rem; cursor:pointer; font-weight:700; font-size:.95rem; transition:all .25s; box-shadow:0 4px 14px rgba(66,133,244,.35); }
.nl-g:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(66,133,244,.45); }
.nl-f { background:#1877f2; color:#fff; border:none; border-radius:50px; padding:.85rem 2rem; cursor:pointer; font-weight:700; font-size:.95rem; transition:all .25s; box-shadow:0 4px 14px rgba(24,119,242,.35); }
.nl-f:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(24,119,242,.45); }

/* ════ BANNER PROFIL ════ */
.profile-banner {
  position: relative;
  background: linear-gradient(135deg, #0e0e22 0%, #1a0a1a 50%, #0a0e22 100%);
  border-radius: 24px;
  padding: 2.5rem 2rem;
  text-align: center;
  margin-bottom:1.5rem;
  border: 1px solid var(--border);
  overflow: hidden;
  animation: fadeUp .4s ease;
}
body.light-theme .profile-banner { background: linear-gradient(135deg,#f0f0fc,#fdf0f8,#f0f4fc); }
/* Cercles décoratifs */
.banner-deco {
  position:absolute; border-radius:50%; pointer-events:none;
}
.banner-deco-1 {
  width:280px; height:280px; top:-80px; right:-80px;
  background: radial-gradient(circle, rgba(233,69,96,.12) 0%, transparent 70%);
}
.banner-deco-2 {
  width:200px; height:200px; bottom:-60px; left:-60px;
  background: radial-gradient(circle, rgba(108,92,231,.1) 0%, transparent 70%);
}

/* Avatar */
.avatar-zone { position:relative; display:inline-block; margin-bottom:1.2rem; cursor:pointer; }
.avatar-ring {
  width:114px; height:114px; border-radius:50%;
  background: conic-gradient(from 0deg, #e94560, #ff6b8b, #8b5cf6, #14b8a6, #e94560);
  padding:3px; animation: rotateBorder 6s linear infinite;
}
@keyframes rotateBorder { to { transform:rotate(360deg); } }
.avatar-inner { background:var(--bg-card); border-radius:50%; padding:3px; }
.avatar-img {
  width:100px; height:100px; border-radius:50%; object-fit:cover; display:block;
}
.avatar-overlay {
  position:absolute; inset:0; border-radius:50%;
  background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .25s; font-size:.75rem; color:#fff; font-weight:600;
}
.avatar-zone:hover .avatar-overlay { opacity:1; }
.online-dot {
  position:absolute; bottom:6px; right:6px;
  width:16px; height:16px; background:#00b894; border-radius:50%;
  border:2.5px solid var(--bg-card);
  box-shadow:0 0 8px rgba(0,184,148,.5);
}
.profile-name {
  font-size:1.65rem; font-weight:900; margin-bottom:.2rem;
  background: linear-gradient(135deg, var(--text), var(--primary-light));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
body.light-theme .profile-name { background: linear-gradient(135deg,#1a1a30,#e94560); -webkit-background-clip:text; background-clip:text; color:transparent; }
.profile-email { font-size:.82rem; color:var(--text-muted); margin-bottom:.6rem; }
.profile-badges { display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; margin-bottom:1.2rem; }
.p-badge {
  display:inline-flex; align-items:center; gap:.3rem;
  background:color-mix(in srgb, var(--primary) 15%, transparent);
  color:var(--primary); border:1px solid color-mix(in srgb, var(--primary) 30%, transparent);
  padding:.2rem .7rem; border-radius:20px; font-size:.72rem; font-weight:600;
}
.p-badge.green { background:rgba(0,184,148,.12); color:#00b894; border-color:rgba(0,184,148,.25); }
.p-badge.purple { background:rgba(139,92,246,.12); color:#8b5cf6; border-color:rgba(139,92,246,.25); }

/* Actions profil */
.profile-actions {
  display:flex; gap:.55rem; justify-content:center; flex-wrap:wrap; margin-top:1.2rem;
}
.act-btn {
  padding:.42rem 1rem; background:rgba(255,255,255,.06); border:1px solid var(--border);
  border-radius:30px; color:var(--text); cursor:pointer; font-size:.78rem; transition:all .2s;
  display:inline-flex; align-items:center; gap:.3rem;
}
.act-btn:hover { background:var(--primary); border-color:var(--primary); color:#fff; }
.act-btn.danger { color:#e17055; border-color:rgba(225,112,85,.3); background:rgba(225,112,85,.08); }
.act-btn.danger:hover { background:#e17055; border-color:#e17055; color:#fff; }

/* ════ STATS ════ */
.stats-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1rem; margin-bottom:1.5rem;
}
.stat-card {
  background:var(--bg-card); border-radius:var(--radius);
  padding:1.4rem 1rem; text-align:center;
  border:1px solid var(--border);
  transition:all .25s; cursor:default; position:relative; overflow:hidden;
}
.stat-card::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg, var(--primary-glow), transparent);
  opacity:0; transition:opacity .25s;
}
.stat-card:hover { transform:translateY(-4px); border-color:var(--primary); box-shadow:var(--shadow-glow); }
.stat-card:hover::before { opacity:1; }
.stat-icon { font-size:1.4rem; margin-bottom:.4rem; }
.stat-n { font-size:1.95rem; font-weight:900; color:var(--primary); line-height:1; }
.stat-l { font-size:.7rem; color:var(--text-muted); margin-top:.3rem; text-transform:uppercase; letter-spacing:.5px; }

/* ════ TABS ════ */
.tabs {
  display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:1.5rem;
  flex-wrap:wrap; background:var(--bg-card); border-radius:var(--radius) var(--radius) 0 0;
  padding:.5rem .5rem 0;
}
.tab-btn {
  padding:.65rem 1.3rem; background:none; border:none; color:var(--text-muted);
  cursor:pointer; font-weight:600; font-size:.84rem; transition:all .2s;
  border-bottom:2.5px solid transparent; margin-bottom:-2px; border-radius:8px 8px 0 0;
  display:inline-flex; align-items:center; gap:.4rem;
}
.tab-btn:hover { color:var(--text); background:var(--bg-hover); }
.tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); background:color-mix(in srgb,var(--primary) 8%,transparent); }
.badge-n { background:var(--primary); color:#fff; padding:.1rem .48rem; border-radius:12px; font-size:.64rem; font-weight:700; }

/* ════ SECTIONS ════ */
.section {
  background:var(--bg-card); border-radius:0 0 var(--radius) var(--radius);
  padding:1.5rem; border:1px solid var(--border); border-top:none;
  margin-bottom:1.5rem; animation:fadeUp .3s ease;
}
.sec-hdr {
  display:flex; justify-content:space-between; align-items:center;
  flex-wrap:wrap; gap:.7rem; margin-bottom:1.3rem;
  padding-bottom:.8rem; border-bottom:1px solid var(--border);
}
.sec-hdr h3 { font-size:.98rem; font-weight:700; display:flex; align-items:center; gap:.4rem; }
.empty { text-align:center; padding:4rem 2rem; color:var(--text-muted); }
.empty-icon { font-size:3rem; margin-bottom:1rem; opacity:.35; display:block; }
.empty p { font-size:.88rem; }

/* ════ FAVORIS ════ */
.fav-toolbar {
  display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin-bottom:1.2rem;
}
.fav-sort {
  padding:.38rem .8rem; background:var(--bg-hover); border:1px solid var(--border);
  border-radius:30px; color:var(--text); font-size:.78rem; cursor:pointer; transition:all .2s;
}
.fav-sort:hover,.fav-sort.active { background:var(--primary); border-color:var(--primary); color:#fff; }
.fav-search {
  padding:.38rem .9rem; background:var(--bg-input); border:1px solid var(--border);
  border-radius:30px; color:var(--text); font-size:.78rem; width:180px; transition:all .2s;
}
.fav-search:focus { outline:none; border-color:var(--primary); }

.fav-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:1rem; }
.fav-item {
  background:var(--bg-hover); border-radius:14px; overflow:hidden;
  cursor:pointer; border:1px solid var(--border); transition:all .25s; position:relative;
  animation: fadeUp .3s ease;
}
.fav-item:hover { transform:translateY(-5px); border-color:var(--primary); box-shadow:0 8px 24px rgba(233,69,96,.15); }
.fav-img-wrap { position:relative; overflow:hidden; }
.fav-item img { width:100%; height:192px; object-fit:cover; display:block; transition:transform .35s; }
.fav-item:hover img { transform:scale(1.07); }
.fav-overlay {
  position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 50%);
  opacity:0; transition:opacity .25s; display:flex; align-items:flex-end; padding:.6rem;
}
.fav-item:hover .fav-overlay { opacity:1; }
.fav-watch-btn {
  background:var(--primary); color:#fff; border:none; border-radius:20px;
  padding:.3rem .8rem; font-size:.7rem; font-weight:700; cursor:pointer; width:100%;
  transition:background .2s;
}
.fav-watch-btn:hover { background:var(--primary-dark); }
.fav-cat-tag {
  position:absolute; top:7px; left:7px;
  background:rgba(0,0,0,.75); backdrop-filter:blur(4px);
  color:#fff; font-size:.6rem; font-weight:700; padding:.15rem .48rem;
  border-radius:10px; text-transform:uppercase; letter-spacing:.4px;
}
.fav-rm-btn {
  position:absolute; top:7px; right:7px;
  background:rgba(0,0,0,.75); backdrop-filter:blur(4px);
  color:#e17055; border:none; border-radius:50%; width:26px; height:26px;
  cursor:pointer; font-size:.8rem; display:flex; align-items:center; justify-content:center;
  transition:all .2s; opacity:0;
}
.fav-item:hover .fav-rm-btn { opacity:1; }
.fav-rm-btn:hover { background:#e17055; color:#fff; }
.fav-body { padding:.7rem .75rem; }
.fav-body h4 { font-size:.8rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:.2rem; }
.fav-score { font-size:.7rem; color:#ffd700; }
.fav-date { font-size:.62rem; color:var(--text-muted); }

/* ════ HISTORIQUE ════ */
.hist-list { display:flex; flex-direction:column; gap:.5rem; }
.hist-item {
  display:flex; align-items:center; gap:.85rem; padding:.7rem .85rem;
  background:var(--bg-hover); border-radius:12px; cursor:pointer;
  border:1px solid var(--border); transition:all .2s; position:relative;
}
.hist-item:hover { border-color:var(--primary); transform:translateX(4px); background:color-mix(in srgb,var(--primary) 6%,var(--bg-hover)); }
.hist-thumb { width:40px; height:56px; object-fit:cover; border-radius:6px; flex-shrink:0; }
.hist-info { flex:1; min-width:0; }
.hist-title { font-size:.86rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:.15rem; }
.hist-meta { font-size:.68rem; color:var(--text-muted); display:flex; gap:.5rem; flex-wrap:wrap; }
.hist-ep { background:var(--primary); color:#fff; padding:.18rem .6rem; border-radius:20px; font-size:.68rem; white-space:nowrap; flex-shrink:0; }
.hist-del { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:.85rem; padding:.2rem .4rem; opacity:0; transition:all .2s; border-radius:5px; flex-shrink:0; }
.hist-item:hover .hist-del { opacity:1; }
.hist-del:hover { background:rgba(225,112,85,.15); color:#e17055; }
.hist-progress { height:3px; background:var(--border); border-radius:2px; margin-top:.5rem; overflow:hidden; }
.hist-progress-bar { height:100%; background:var(--primary); border-radius:2px; transition:width .3s; }

/* ════ STATS ════ */
.stats-panels { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.stats-panel { background:var(--bg-hover); border-radius:var(--radius-sm); padding:1.1rem; border:1px solid var(--border); }
.stats-panel h4 { font-size:.82rem; font-weight:700; color:var(--primary); margin-bottom:.9rem; }
.s-row { display:flex; justify-content:space-between; align-items:center; padding:.4rem 0; border-bottom:1px solid var(--border); font-size:.82rem; }
.s-row:last-child { border:none; }
.s-key { color:var(--text-muted); }
.s-val { color:var(--text); font-weight:700; }
/* Barre de progression stat */
.s-bar { margin-top:.8rem; }
.s-bar-label { display:flex; justify-content:space-between; font-size:.72rem; color:var(--text-muted); margin-bottom:.3rem; }
.s-bar-track { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.s-bar-fill { height:100%; background:linear-gradient(90deg,var(--primary),var(--primary-light)); border-radius:3px; transition:width .6s ease; }

/* Genres donut simulé via barres */
.genre-bars { display:flex; flex-direction:column; gap:.55rem; }
.g-bar-item { display:flex; align-items:center; gap:.6rem; font-size:.78rem; }
.g-bar-label { width:70px; color:var(--text-muted); text-align:right; flex-shrink:0; }
.g-bar-track { flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
.g-bar-fill { height:100%; border-radius:4px; transition:width .8s ease; }
.g-bar-count { width:28px; color:var(--text); font-weight:700; text-align:right; flex-shrink:0; }

/* ════ PARAMÈTRES ════ */
.settings-sections { display:flex; flex-direction:column; gap:1.2rem; }
.settings-group { background:var(--bg-hover); border-radius:var(--radius-sm); padding:1.1rem; border:1px solid var(--border); }
.settings-group-title { font-size:.78rem; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:.6px; margin-bottom:.9rem; }
.setting-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:.65rem 0; border-bottom:1px solid var(--border);
}
.setting-row:last-child { border:none; }
.setting-left { flex:1; min-width:0; }
.setting-label { font-size:.86rem; font-weight:500; margin-bottom:.12rem; }
.setting-desc { font-size:.7rem; color:var(--text-muted); }
/* Toggle switch design */
.toggle-wrap { position:relative; width:46px; height:26px; flex-shrink:0; }
.toggle-wrap input { opacity:0; width:0; height:0; position:absolute; }
.toggle-track {
  position:absolute; inset:0; background:var(--border);
  border-radius:13px; cursor:pointer; transition:background .3s;
}
.toggle-wrap input:checked ~ .toggle-track { background:var(--primary); }
.toggle-knob {
  position:absolute; top:3px; left:3px; width:20px; height:20px;
  background:#fff; border-radius:50%; transition:transform .3s;
  box-shadow:0 1px 4px rgba(0,0,0,.25); pointer-events:none;
}
.toggle-wrap input:checked ~ .toggle-knob { transform:translateX(20px); }
/* Select style */
.setting-select {
  padding:.32rem .7rem; background:var(--bg-input); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-size:.78rem; cursor:pointer; transition:all .2s;
}
.setting-select:focus { outline:none; border-color:var(--primary); }

/* Zone danger */
.danger-zone { border-color:rgba(225,112,85,.25); background:rgba(225,112,85,.04); }
.danger-zone .settings-group-title { color:#e17055; }

/* ════ TOAST ════ */
#toast {
  position:fixed; bottom:28px; left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--bg-card); color:var(--text);
  border:1px solid var(--border); border-left:4px solid var(--primary);
  border-radius:var(--radius-sm); padding:.75rem 1.4rem;
  font-size:.82rem; min-width:240px; text-align:center;
  box-shadow:var(--shadow); opacity:0; pointer-events:none;
  transition:opacity .3s, transform .3s; z-index:9999;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
#toast.success { border-left-color:#00b894; }
#toast.warning { border-left-color:#fdcb6e; }
#toast.error   { border-left-color:#e17055; }

/* ════ ANIMATIONS ════ */
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

/* ════ RESPONSIVE ════ */
@media(max-width:768px){
  .cont { padding:1rem; }
  .stats-panels { grid-template-columns:1fr; }
  .fav-grid { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .profile-banner { padding:1.8rem 1rem; }
}
@media(max-width:480px){
  .stats-grid { grid-template-columns:1fr 1fr; }
  .fav-grid { grid-template-columns:repeat(2,1fr); }
  .tabs { padding:.4rem .4rem 0; }
  .tab-btn { padding:.55rem .85rem; font-size:.78rem; }
}
  </style>
</head>
<body>

<!-- ════ HEADER ════ -->
<header>
  <div class="hdr">
    <a href="index.html" class="home-link">← Accueil</a>
    <span class="hdr-title">👤 Mon Profil</span>
    <div class="hdr-right">
      <div class="hdr-auth" id="hdrAuth">
        <button class="hdr-g" onclick="loginGoogle()">🔵 Google</button>
        <button class="hdr-f" onclick="loginFacebook()">📘 Facebook</button>
      </div>

    </div>
  </div>
</header>

<main class="cont" id="mainCont">
  <div style="text-align:center;padding:5rem;color:var(--text-muted)">⏳ Chargement du profil…</div>
</main>
<div id="toast"></div>

<script>
/* ════ FIREBASE ════ */
const fbCfg={apiKey:"AIzaSyCwDOGPUWQ08WGuAAZ9p6hS6SZytmRoKig",authDomain:"arkya-animemanga.firebaseapp.com",projectId:"arkya-animemanga",storageBucket:"arkya-animemanga.firebasestorage.app",messagingSenderId:"52570519836",appId:"1:52570519836:web:dbf4fcd7aafe01aac762d9"};
if(!firebase.apps.length)firebase.initializeApp(fbCfg);
const fbAuth=firebase.auth();
let fbDb=null;
try{fbDb=firebase.firestore();fbDb.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(_){}
const gProv=new firebase.auth.GoogleAuthProvider();
const fProv=new firebase.auth.FacebookAuthProvider();
gProv.setCustomParameters({prompt:'select_account'});

/* ════ ÉTAT ════ */
let currentUser=null;
let userData={
  favorites:[],history:[],
  stats:{animesWatched:0,episodesWatched:0,totalHours:0,memberSince:new Date().toISOString()},
  settings:{theme:'dark',autoplay:true,notifications:true,profilePublic:false,defaultLang:'vf',episodesPerPage:60}
};
let currentTab='favorites';
let favSort='date'; // 'date'|'score'|'alpha'
let favFilter='';

/* ════ UTILS ════ */
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const PH="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 200'%3E%3Crect width='150' height='200' fill='%231a1a2e'/%3E%3C/svg%3E";
const AVA="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23252540'/%3E%3Cpath d='M50 55c-11 0-20 5-20 11v6h40v-6c0-6-9-11-20-11zm0-5a10 10 0 1 0 0-20 10 10 0 0 0 0 20z' fill='%238888aa'/%3E%3C/svg%3E";
let toastT;
function toast(m,type=''){
  const e=document.getElementById('toast');
  e.textContent=m;e.className='show';
  if(type)e.classList.add(type);
  clearTimeout(toastT);toastT=setTimeout(()=>e.className='',2800);
}

/* ════ THÈME ════ */
(()=>{
  const s=localStorage.getItem('akrya_theme');
  if(s==='light')document.body.classList.add('light-theme');
  document.getElementById('themeToggle').textContent=s==='light'?'☀️':'🌙';
})();
document.getElementById('themeToggle').addEventListener('click',()=>{
  document.body.classList.toggle('light-theme');
  const l=document.body.classList.contains('light-theme');
  localStorage.setItem('akrya_theme',l?'light':'dark');
  document.getElementById('themeToggle').textContent=l?'☀️':'🌙';
  userData.settings.theme=l?'light':'dark';
  saveToFirestore();
});

/* ════ AUTH ════ */
fbAuth.onAuthStateChanged(async u=>{
  currentUser=u;
  updateHdrAuth();
  if(u){await loadFromFirestore();render();}
  else{renderNotLogged();}
});
function updateHdrAuth(){
  const ha=document.getElementById('hdrAuth');
  if(!ha)return;
  if(currentUser){
    ha.innerHTML=`<div class="hdr-user">
      <img class="hdr-avatar" src="${currentUser.photoURL||AVA}" onerror="this.src='${AVA}'" alt="">
      <span style="font-size:.78rem;font-weight:600">${esc(currentUser.displayName||currentUser.email?.split('@')[0])}</span>
      <button class="hdr-logout" onclick="doLogout()">🚪</button>
    </div>`;
  }else{
    ha.innerHTML=`<button class="hdr-g" onclick="loginGoogle()">🔵 Google</button><button class="hdr-f" onclick="loginFacebook()">📘 Facebook</button>`;
  }
}
function authErr(e){return({'auth/popup-blocked':'Popup bloqué.','auth/popup-closed-by-user':'Annulé.','auth/network-request-failed':'Erreur réseau.'})[e.code]||e.message||'Erreur';}
async function loginGoogle(){try{await fbAuth.signInWithPopup(gProv);}catch(e){toast('❌ '+authErr(e),'error');}}
async function loginFacebook(){try{await fbAuth.signInWithPopup(fProv);}catch(e){toast('❌ '+authErr(e),'error');}}
async function doLogout(){if(!confirm('Se déconnecter ?'))return;await fbAuth.signOut();toast('🔓 Déconnecté');setTimeout(()=>location.href='index.html',1200);}
window.loginGoogle=loginGoogle;window.loginFacebook=loginFacebook;

/* ════ FIRESTORE ════ */
async function loadFromFirestore(){
  const localFavs=JSON.parse(localStorage.getItem('akrya_fav')||'[]');
  userData.favorites=localFavs;
  if(!fbDb||!currentUser)return;
  try{
    const doc=await fbDb.collection('users').doc(currentUser.uid).get();
    if(doc.exists){
      const d=doc.data();
      if(d.favorites?.length)userData.favorites=d.favorites;
      if(d.history?.length)userData.history=d.history;
      if(d.stats)userData.stats={...userData.stats,...d.stats};
      if(d.settings)userData.settings={...userData.settings,...d.settings};
      localStorage.setItem('akrya_fav',JSON.stringify(userData.favorites));
    }else{await saveToFirestore();}
  }catch(e){console.warn('[Firestore]',e.message);}
}
async function saveToFirestore(){
  localStorage.setItem('akrya_fav',JSON.stringify(userData.favorites));
  if(!fbDb||!currentUser)return;
  try{
    await fbDb.collection('users').doc(currentUser.uid).set({
      favorites:userData.favorites,history:userData.history,
      stats:userData.stats,settings:userData.settings,
      displayName:currentUser.displayName,email:currentUser.email,photoURL:currentUser.photoURL,
      lastUpdated:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
  }catch(e){console.warn('[FS write]',e.message);}
}

/* ════ FAVORIS LOGIC ════ */
function sortedFavs(){
  let f=[...userData.favorites];
  if(favFilter)f=f.filter(x=>(x.title||'').toLowerCase().includes(favFilter.toLowerCase()));
  if(favSort==='score')f.sort((a,b)=>parseFloat(b.score||0)-parseFloat(a.score||0));
  else if(favSort==='alpha')f.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
  else f.sort((a,b)=>new Date(b.dateAdded||0)-new Date(a.dateAdded||0));
  return f;
}
function removeFav(id,cat){
  userData.favorites=userData.favorites.filter(f=>!(f.id==id&&(f.cat||'anime')===cat));
  userData.stats.animesWatched=userData.favorites.length;
  saveToFirestore();renderTab();toast('💔 Retiré des favoris');
}
function removeHist(id){
  userData.history=userData.history.filter(h=>h.id!==id);
  saveToFirestore();renderTab();toast('✓ Supprimé de l\'historique');
}
function clearHistory(){
  if(!confirm('Effacer tout l\'historique ?'))return;
  userData.history=[];saveToFirestore();renderTab();toast('🗑️ Historique effacé');
}

/* ════ EXPORT / IMPORT ════ */
function exportData(){
  const d={user:{name:currentUser?.displayName,email:currentUser?.email},favorites:userData.favorites,history:userData.history,stats:userData.stats,settings:userData.settings,exportDate:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`akrya-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);
  toast('📥 Export réussi !','success');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=async e=>{
    const r=new FileReader();
    r.onload=async ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.favorites)userData.favorites=d.favorites;
        if(d.history)userData.history=d.history;
        if(d.stats)userData.stats={...userData.stats,...d.stats};
        if(d.settings)userData.settings={...userData.settings,...d.settings};
        await saveToFirestore();render();toast('📤 Import réussi !','success');
      }catch(_){toast('❌ Fichier invalide','error');}
    };r.readAsText(e.target.files[0]);
  };inp.click();
}
async function deleteAllData(){
  if(!prompt('Tapez "SUPPRIMER" pour confirmer la suppression de toutes vos données :')?.toUpperCase().includes('SUPPRIMER'))return;
  userData={favorites:[],history:[],stats:{animesWatched:0,episodesWatched:0,totalHours:0,memberSince:new Date().toISOString()},settings:{...userData.settings}};
  localStorage.removeItem('akrya_fav');
  if(fbDb&&currentUser)await fbDb.collection('users').doc(currentUser.uid).delete().catch(()=>{});
  render();toast('🗑️ Données supprimées','warning');
}

/* ════ CHANGER AVATAR ════ */
function changeAvatar(){
  const url=prompt('URL de votre nouvel avatar :');
  if(!url)return;
  userData.settings.customAvatar=url;
  saveToFirestore();render();toast('✅ Avatar mis à jour','success');
}

/* ════ RENDU PAS CONNECTÉ ════ */
function renderNotLogged(){
  document.getElementById('mainCont').innerHTML=`
    <div class="not-logged">
      <div class="nl-illustration">🎌</div>
      <h2>Bienvenue sur Akrya</h2>
      <p>Connectez-vous pour accéder à votre profil, synchroniser vos favoris et suivre votre progression de visionnage.</p>
      <div class="nl-btns">
        <button class="nl-g" onclick="loginGoogle()">🔵 Continuer avec Google</button>
        <button class="nl-f" onclick="loginFacebook()">📘 Continuer avec Facebook</button>
      </div>
    </div>`;
}

/* ════ RENDU PRINCIPAL ════ */
function render(){
  const u=currentUser;
  const since=new Date(userData.stats.memberSince||Date.now());
  const sinceStr=since.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  const days=Math.max(1,Math.floor((Date.now()-since)/(86400000)));
  const totalSeries=new Set(userData.history.map(h=>h.id)).size;
  const avatar=userData.settings.customAvatar||u.photoURL||AVA;

  document.getElementById('mainCont').innerHTML=`
    <!-- BANNER -->
    <div class="profile-banner">
      <div class="banner-deco banner-deco-1"></div>
      <div class="banner-deco banner-deco-2"></div>
      <div class="avatar-zone" onclick="changeAvatar()">
        <div class="avatar-ring">
          <div class="avatar-inner">
            <img class="avatar-img" src="${avatar}" onerror="this.src='${AVA}'" alt="Avatar">
          </div>
        </div>
        <div class="avatar-overlay">✏️ Modifier</div>
        <div class="online-dot"></div>
      </div>
      <div class="profile-name">${esc(u.displayName||u.email?.split('@')[0]||'Utilisateur')}</div>
      <div class="profile-email">${esc(u.email||'')}</div>
      <div class="profile-badges">
        <span class="p-badge">🎌 Membre depuis ${sinceStr}</span>
        ${userData.stats.episodesWatched>=100?'<span class="p-badge purple">⭐ Passionné</span>':userData.stats.episodesWatched>=10?'<span class="p-badge green">🌱 Débutant</span>':''}
        ${userData.favorites.length>=20?'<span class="p-badge">❤️ Collectionneur</span>':''}
      </div>
      <div class="profile-actions">
        <button class="act-btn" onclick="refreshData()">🔄 Actualiser</button>
        <button class="act-btn" onclick="exportData()">📥 Exporter</button>
        <button class="act-btn" onclick="importData()">📤 Importer</button>
        <button class="act-btn danger" onclick="doLogout()">🚪 Déconnexion</button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon">❤️</div><div class="stat-n">${userData.favorites.length}</div><div class="stat-l">Favoris</div></div>
      <div class="stat-card"><div class="stat-icon">📺</div><div class="stat-n">${totalSeries}</div><div class="stat-l">Séries vues</div></div>
      <div class="stat-card"><div class="stat-icon">🎬</div><div class="stat-n">${userData.stats.episodesWatched||0}</div><div class="stat-l">Épisodes</div></div>
      <div class="stat-card"><div class="stat-icon">⏱️</div><div class="stat-n">${userData.stats.totalHours||0}<span style="font-size:1rem">h</span></div><div class="stat-l">Visionnés</div></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn${currentTab==='favorites'?' active':''}" onclick="switchTab('favorites')">❤️ Favoris <span class="badge-n">${userData.favorites.length}</span></button>
      <button class="tab-btn${currentTab==='history'?' active':''}"   onclick="switchTab('history')">📜 Historique <span class="badge-n">${userData.history.length}</span></button>
      <button class="tab-btn${currentTab==='stats'?' active':''}"     onclick="switchTab('stats')">📊 Statistiques</button>
      <button class="tab-btn${currentTab==='settings'?' active':''}"  onclick="switchTab('settings')">⚙️ Paramètres</button>
    </div>
    <div class="section" id="tabContent"></div>`;

  renderTab();
}

window.switchTab=function(tab){currentTab=tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.includes(tab==='favorites'?'Favoris':tab==='history'?'Historique':tab==='stats'?'Stat':'Param')));renderTab();};

function renderTab(){
  const c=document.getElementById('tabContent');
  if(!c)return;
  if(currentTab==='favorites')renderFavorites(c);
  else if(currentTab==='history')renderHistory(c);
  else if(currentTab==='stats')renderStats(c);
  else if(currentTab==='settings')renderSettings(c);
}

/* ════ ONGLET FAVORIS ════ */
function renderFavorites(c){
  const favs=sortedFavs();
  c.innerHTML=`
    <div class="sec-hdr">
      <h3>❤️ Mes favoris <span class="badge-n">${userData.favorites.length}</span></h3>
      ${userData.favorites.length?`<button class="act-btn danger" onclick="if(confirm('Vider tous les favoris ?')){userData.favorites=[];saveToFirestore();renderTab();toast('Favoris vidés','warning');}">🗑️ Vider</button>`:''}
    </div>
    <div class="fav-toolbar">
      <span style="font-size:.74rem;color:var(--text-muted);margin-right:.2rem">Trier:</span>
      <button class="fav-sort${favSort==='date'?' active':''}" onclick="favSort='date';renderTab()">📅 Récent</button>
      <button class="fav-sort${favSort==='score'?' active':''}" onclick="favSort='score';renderTab()">⭐ Note</button>
      <button class="fav-sort${favSort==='alpha'?' active':''}" onclick="favSort='alpha';renderTab()">🔤 A-Z</button>
      <input class="fav-search" type="text" placeholder="🔍 Filtrer…" value="${esc(favFilter)}"
        oninput="favFilter=this.value;renderTab()">
    </div>
    ${favs.length===0?`<div class="empty"><span class="empty-icon">❤️</span><p>${userData.favorites.length===0?'Aucun favori. Parcourez le catalogue et ajoutez vos œuvres !':'Aucun résultat pour ce filtre.'}</p></div>`:
    `<div class="fav-grid">${favs.map(f=>`
      <div class="fav-item" data-id="${f.id}" data-cat="${f.cat||'anime'}">
        <div class="fav-img-wrap">
          <img src="${f.image||PH}" onerror="this.src='${PH}'" alt="${esc(f.title)}" loading="lazy">
          <div class="fav-overlay"><button class="fav-watch-btn" onclick="event.stopPropagation();location.href='watch.html?id=${f.id}&type=${f.cat||'anime'}&ep=1'">▶ Regarder</button></div>
          <span class="fav-cat-tag">${f.cat||'anime'}</span>
          <button class="fav-rm-btn" onclick="event.stopPropagation();removeFav('${f.id}','${f.cat||'anime'}')" title="Retirer">✕</button>
        </div>
        <div class="fav-body">
          <h4 title="${esc(f.title)}">${esc(f.title?.length>22?f.title.slice(0,20)+'…':f.title)}</h4>
          ${f.score?`<div class="fav-score">⭐ ${f.score}</div>`:''}
          <div class="fav-date">${f.dateAdded?new Date(f.dateAdded).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}):''}</div>
        </div>
      </div>`).join('')}</div>`}`;

  c.querySelectorAll('.fav-item').forEach(el=>{
    el.addEventListener('click',e=>{if(e.target.closest('.fav-rm-btn')||e.target.closest('.fav-watch-btn'))return;location.href=`detail.html?id=${el.dataset.id}&type=${el.dataset.cat}`;});
  });
}

/* ════ ONGLET HISTORIQUE ════ */
function renderHistory(c){
  const hist=userData.history;
  c.innerHTML=`
    <div class="sec-hdr">
      <h3>📜 Historique <span class="badge-n">${hist.length}</span></h3>
      ${hist.length?`<button class="act-btn danger" onclick="clearHistory()">🗑️ Tout effacer</button>`:''}
    </div>
    ${hist.length===0?`<div class="empty"><span class="empty-icon">📜</span><p>Aucun historique. Regardez un épisode pour le voir apparaître ici !</p></div>`:
    `<div class="hist-list">${hist.map(h=>{
      const ep=parseInt(h.episode||1);
      const total=parseInt(h.totalEps||0);
      const pct=total>0?Math.min(100,Math.round(ep/total*100)):0;
      return`<div class="hist-item" data-id="${h.id}" data-ep="${ep}" data-type="${h.type||'anime'}">
        <img class="hist-thumb" src="${h.image||PH}" onerror="this.src='${PH}'" alt="">
        <div class="hist-info">
          <div class="hist-title">${esc(h.title||'Sans titre')}</div>
          <div class="hist-meta">
            <span>📅 ${new Date(h.date||Date.now()).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}</span>
            <span>· ${h.type||'anime'}</span>
          </div>
          ${total>0?`<div class="hist-progress"><div class="hist-progress-bar" style="width:${pct}%"></div></div>`:''}
        </div>
        <span class="hist-ep">${h.type==='manga'||h.type==='webtoon'?'Ch.':'Ép.'} ${ep}</span>
        <button class="hist-del" onclick="event.stopPropagation();removeHist('${h.id}')" title="Supprimer">✕</button>
      </div>`;}).join('')}</div>`}`;

  c.querySelectorAll('.hist-item').forEach(el=>{
    el.addEventListener('click',e=>{if(e.target.classList.contains('hist-del'))return;location.href=`watch.html?id=${el.dataset.id}&type=${el.dataset.type||'anime'}&ep=${el.dataset.ep||1}`;});
  });
}

/* ════ ONGLET STATS ════ */
function renderStats(c){
  const since=new Date(userData.stats.memberSince||Date.now());
  const days=Math.max(1,Math.floor((Date.now()-since)/86400000));
  const totalSeries=new Set(userData.history.map(h=>h.id)).size;
  const avg=userData.favorites.length>0?(userData.favorites.reduce((a,f)=>a+parseFloat(f.score||0),0)/userData.favorites.length).toFixed(1):'—';
  const epPerDay=(userData.stats.episodesWatched/days).toFixed(2);
  const hPerDay=(userData.stats.totalHours/days).toFixed(1);

  // Genres depuis les favoris
  const genreCount={};
  userData.favorites.forEach(f=>{const c=f.cat||'anime';genreCount[c]=(genreCount[c]||0)+1;});
  const maxG=Math.max(...Object.values(genreCount),1);
  const genreColors={anime:'#e94560',manga:'#8b5cf6',webtoon:'#14b8a6'};

  c.innerHTML=`
    <div class="sec-hdr"><h3>📊 Statistiques détaillées</h3></div>
    <div class="stats-panels">
      <div class="stats-panel">
        <h4>🎬 Visionnage</h4>
        <div class="s-row"><span class="s-key">Séries vues</span><span class="s-val">${totalSeries}</span></div>
        <div class="s-row"><span class="s-key">Épisodes</span><span class="s-val">${userData.stats.episodesWatched||0}</span></div>
        <div class="s-row"><span class="s-key">Heures totales</span><span class="s-val">${userData.stats.totalHours||0} h</span></div>
        <div class="s-row"><span class="s-key">Épisodes / jour</span><span class="s-val">${epPerDay}</span></div>
        <div class="s-row"><span class="s-key">Heures / jour</span><span class="s-val">${hPerDay} h</span></div>
        <div class="s-bar">
          <div class="s-bar-label"><span>Progression globale</span><span>${Math.min(userData.stats.episodesWatched||0,1000)} / 1000 ép.</span></div>
          <div class="s-bar-track"><div class="s-bar-fill" style="width:${Math.min(100,((userData.stats.episodesWatched||0)/1000)*100)}%"></div></div>
        </div>
      </div>
      <div class="stats-panel">
        <h4>❤️ Favoris</h4>
        <div class="s-row"><span class="s-key">Total favoris</span><span class="s-val">${userData.favorites.length}</span></div>
        <div class="s-row"><span class="s-key">Note moyenne</span><span class="s-val">${avg}</span></div>
        <div class="s-row"><span class="s-key">Historique</span><span class="s-val">${userData.history.length}</span></div>
        <div class="genre-bars" style="margin-top:.9rem">
          ${Object.entries(genreCount).map(([cat,n])=>`
            <div class="g-bar-item">
              <span class="g-bar-label">${cat}</span>
              <div class="g-bar-track"><div class="g-bar-fill" style="width:${Math.round(n/maxG*100)}%;background:${genreColors[cat]||'#e94560'}"></div></div>
              <span class="g-bar-count">${n}</span>
            </div>`).join('')||'<p style="font-size:.78rem;color:var(--text-muted)">Ajoutez des favoris pour voir les statistiques.</p>'}
        </div>
      </div>
      <div class="stats-panel">
        <h4>📅 Compte</h4>
        <div class="s-row"><span class="s-key">Membre depuis</span><span class="s-val">${since.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}</span></div>
        <div class="s-row"><span class="s-key">Jours d'activité</span><span class="s-val">${days}</span></div>
        <div class="s-row"><span class="s-key">Email</span><span class="s-val" style="font-size:.75rem">${esc(currentUser?.email||'—')}</span></div>
        <div class="s-row"><span class="s-key">Connexion</span><span class="s-val">${currentUser?.providerData?.[0]?.providerId==='google.com'?'Google':'Facebook'}</span></div>
      </div>
      <div class="stats-panel">
        <h4>🏆 Palmarès</h4>
        <div class="s-row"><span class="s-key">Niveau</span><span class="s-val">${(userData.stats.episodesWatched||0)>=500?'🔥 Expert':(userData.stats.episodesWatched||0)>=100?'⭐ Passionné':(userData.stats.episodesWatched||0)>=10?'🌱 Débutant':'🆕 Nouveau'}</span></div>
        <div class="s-row"><span class="s-key">Prochain badge</span><span class="s-val">${(userData.stats.episodesWatched||0)<10?`${10-(userData.stats.episodesWatched||0)} ép. → 🌱`:(userData.stats.episodesWatched||0)<100?`${100-(userData.stats.episodesWatched||0)} ép. → ⭐`:(userData.stats.episodesWatched||0)<500?`${500-(userData.stats.episodesWatched||0)} ép. → 🔥`:'Max atteint 🏆'}</span></div>
        <div class="s-bar" style="margin-top:.9rem">
          <div class="s-bar-label"><span>Vers le prochain badge</span></div>
          <div class="s-bar-track"><div class="s-bar-fill" style="width:${Math.min(100,((userData.stats.episodesWatched||0)%100))}%"></div></div>
        </div>
      </div>
    </div>`;
}

function applyThemeSetting(isDark){
  document.body.classList.toggle('light-theme',!isDark);
  localStorage.setItem('akrya_theme',isDark?'dark':'light');
  document.getElementById('themeToggle').textContent=isDark?'🌙':'☀️';
  userData.settings.theme=isDark?'dark':'light';
  saveToFirestore();
}
function saveSetting(key,val){userData.settings[key]=val;saveToFirestore();toast(`✅ Paramètre enregistré`,'success');}
async function reqNotif(enable){
  if(enable&&'Notification' in window&&Notification.permission!=='granted'){
    const p=await Notification.requestPermission();
    if(p!=='granted')toast('⚠️ Notifications refusées par le navigateur','warning');
  }
}
window.reqNotif=reqNotif;

async function refreshData(){await loadFromFirestore();render();toast('✅ Données actualisées','success');}
</script>
