<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>
/* ══════════════════════════════════════════
   VARIABLES — 3 thèmes catégorie
══════════════════════════════════════════ */
:root{
  --primary:#e94560;--primary-dark:#c72e48;--primary-light:#ff6b8b;
  --primary-glow:rgba(233,69,96,.18);
  --bg:#07070e;--bg-card:#111120;--bg-hover:#1a1a2e;--bg-input:#14142a;
  --text:#efefff;--text-muted:#7777aa;--border:#22223a;
  --radius:18px;--radius-sm:10px;--radius-lg:26px;
  --shadow:0 8px 32px rgba(0,0,0,.5);
  --shadow-card:0 12px 36px rgba(233,69,96,.16);
  --transition:all .28s ease;
}
body.light-theme{--bg:#f2f2fa;--bg-card:#fff;--bg-hover:#e8e8f4;--bg-input:#eeeef8;--text:#1a1a30;--text-muted:#6666aa;--border:#d0d0e8;}
body.t-manga  {--primary:#8b5cf6;--primary-dark:#6d3fd4;--primary-light:#a78bfa;--primary-glow:rgba(139,92,246,.18);--shadow-card:0 12px 36px rgba(139,92,246,.16);}
body.t-webtoon{--primary:#14b8a6;--primary-dark:#0d9488;--primary-light:#2dd4bf;--primary-glow:rgba(20,184,166,.18);--shadow-card:0 12px 36px rgba(20,184,166,.16);}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .35s,color .35s;line-height:1.5;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg-card);}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;}

/* ══ HEADER ══ */
header{background:linear-gradient(135deg,#030308,#0d0d1e);padding:.9rem 2rem;position:sticky;top:0;z-index:200;border-bottom:1px solid var(--border);backdrop-filter:blur(14px);}
body.light-theme header{background:linear-gradient(135deg,#eeeef8,#f8f8ff);}
.hdr{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;}
.home-link{color:var(--primary);text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:.35rem;transition:color .2s;font-size:.9rem;}
.home-link:hover{color:var(--primary-light);}
.hdr-title{font-size:1rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.hdr-right{margin-left:auto;display:flex;gap:.45rem;align-items:center;}
.icon-btn{background:var(--bg-hover);border:1px solid var(--border);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;color:var(--text);transition:var(--transition);text-decoration:none;flex-shrink:0;}
.icon-btn:hover{background:var(--primary);border-color:var(--primary);}

/* ══ CONTAINER ══ */
.container{max-width:1280px;margin:0 auto;padding:2rem;}

/* ══ HERO ══ */
.detail-hero{
  display:flex;gap:2.2rem;
  background:var(--bg-card);border-radius:var(--radius-lg);
  padding:2rem;margin-bottom:1.8rem;
  border:1px solid var(--border);
  animation:fadeIn .4s ease;
  position:relative;overflow:hidden;
}
.detail-hero::before{
  content:'';position:absolute;top:-70px;left:-70px;
  width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,var(--primary-glow) 0%,transparent 70%);
  pointer-events:none;transition:background .4s;
}
.detail-hero::after{
  content:'';position:absolute;bottom:-50px;right:-50px;
  width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--primary) 8%,transparent) 0%,transparent 70%);
  pointer-events:none;
}
body.light-theme .detail-hero{background:linear-gradient(135deg,#f5f5ff,#fff);}

.hero-poster{width:215px;flex-shrink:0;position:relative;}
.hero-poster img{width:100%;border-radius:var(--radius-sm);box-shadow:var(--shadow-card);display:block;transition:transform .35s;}
.hero-poster img:hover{transform:scale(1.025);}
.poster-score{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.84);color:#ffd700;font-weight:800;font-size:.84rem;padding:.28rem .6rem;border-radius:20px;backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:2;}
.poster-status{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:.68rem;font-weight:700;padding:.25rem .5rem;border-radius:0 0 var(--radius-sm) var(--radius-sm);}
.poster-status.airing  {background:rgba(0,184,148,.88);color:#fff;}
.poster-status.finished{background:rgba(85,90,110,.88);color:#fff;}
.poster-status.upcoming{background:rgba(253,203,110,.88);color:#111;}
.poster-status.hiatus  {background:rgba(225,112,85,.88);color:#fff;}

.hero-info{flex:1;min-width:0;z-index:1;}
.hero-info h1{font-size:1.9rem;font-weight:900;margin-bottom:.25rem;line-height:1.15;}
.hero-info h2{font-size:.97rem;color:var(--text-muted);margin-bottom:.9rem;font-weight:400;}

/* Score ring SVG */
.score-ring-wrap{display:inline-flex;flex-direction:column;align-items:center;margin-right:.3rem;}
.score-ring{position:relative;width:66px;height:66px;}
.score-ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
.score-ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:900;color:var(--primary);}
.score-ring-lbl{font-size:.58rem;color:var(--text-muted);margin-top:.15rem;}

.stats-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.85rem;align-items:center;}
.stat-pill{background:var(--bg-hover);padding:.26rem .7rem;border-radius:20px;font-size:.77rem;border:1px solid var(--border);}
.next-ep-banner{
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 16%,transparent),transparent);
  border:1px solid color-mix(in srgb,var(--primary) 32%,transparent);
  border-radius:var(--radius-sm);padding:.6rem 1rem;margin:.7rem 0;font-size:.82rem;
  display:flex;align-items:center;gap:.45rem;
}
.action-row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.1rem;}
.btn-primary{
  display:inline-flex;align-items:center;gap:.4rem;
  background:var(--primary);color:#fff;padding:.65rem 1.55rem;border-radius:40px;
  text-decoration:none;font-weight:700;border:none;cursor:pointer;
  transition:var(--transition);font-size:.88rem;
  box-shadow:0 4px 14px var(--primary-glow);
}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);}
.btn-outline{
  display:inline-flex;align-items:center;gap:.4rem;
  background:transparent;color:var(--primary);
  border:2px solid var(--primary);padding:.6rem 1.35rem;border-radius:40px;
  font-weight:700;cursor:pointer;transition:var(--transition);font-size:.88rem;
}
.btn-outline:hover,.btn-outline.fav-active{background:var(--primary);color:#fff;}
.btn-sm{
  padding:.36rem .88rem;font-size:.75rem;border-radius:30px;
  background:var(--bg-hover);border:1px solid var(--border);color:var(--text);
  cursor:pointer;transition:var(--transition);
  display:inline-flex;align-items:center;gap:.28rem;text-decoration:none;
}
.btn-sm:hover{background:var(--primary);border-color:var(--primary);color:#fff;}

/* ══ ONGLETS PAGE ══ */
.page-tabs{
  display:flex;border-bottom:2px solid var(--border);
  margin-bottom:0;background:var(--bg-card);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:.42rem .42rem 0;flex-wrap:wrap;
  border:1px solid var(--border);border-bottom:none;
}
.ptab{
  padding:.58rem 1.2rem;background:none;border:none;
  color:var(--text-muted);cursor:pointer;font-weight:600;font-size:.82rem;
  transition:var(--transition);border-bottom:2.5px solid transparent;
  margin-bottom:-1px;border-radius:8px 8px 0 0;
  display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap;
}
.ptab:hover{color:var(--text);background:var(--bg-hover);}
.ptab.active{color:var(--primary);border-bottom-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent);}
.tab-badge{background:var(--primary);color:#fff;padding:.06rem .42rem;border-radius:12px;font-size:.66rem;margin-left:.2rem;font-weight:700;}

/* ══ SECTION CONTENU ══ */
.section{
  background:var(--bg-card);
  border-radius:0 0 var(--radius) var(--radius);
  padding:1.5rem;
  border:1px solid var(--border);border-top:2px solid var(--primary);
  margin-bottom:1.5rem;
  animation:fadeIn .28s ease;
  min-height:200px;
}

/* INFO GRID */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:.9rem;margin-bottom:1.4rem;}
.info-card{background:var(--bg-hover);border-radius:var(--radius-sm);padding:1.1rem;border:1px solid var(--border);}
.info-card h3{color:var(--primary);margin-bottom:.72rem;font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:.35rem;}
.info-row{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid var(--border);font-size:.8rem;gap:.5rem;}
.info-row:last-child{border:none;}
.info-key{color:var(--text-muted);flex-shrink:0;}
.info-val{color:var(--text);font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.42rem;}
.tag{
  background:color-mix(in srgb,var(--primary) 16%,transparent);
  color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 32%,transparent);
  padding:.16rem .5rem;border-radius:20px;font-size:.68rem;font-weight:600;
  cursor:pointer;transition:var(--transition);
}
.tag:hover{background:var(--primary);color:#fff;border-color:var(--primary);}

/* SYNOPSIS */
.synopsis-box{background:var(--bg-hover);border-radius:var(--radius-sm);padding:1.25rem;border:1px solid var(--border);margin-bottom:1.3rem;}
.synopsis-tabs{display:flex;gap:.32rem;margin-bottom:.85rem;flex-wrap:wrap;}
.syn-tab{padding:.33rem .88rem;background:var(--bg-card);border:1px solid var(--border);border-radius:30px;color:var(--text-muted);cursor:pointer;font-size:.77rem;transition:var(--transition);}
.syn-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
#synopsisText{line-height:1.8;color:var(--text-muted);font-size:.85rem;max-height:165px;overflow:hidden;transition:max-height .5s ease;}
#synopsisText.expanded{max-height:4000px;}
.expand-btn{display:block;width:100%;text-align:center;background:none;border:none;color:var(--primary);cursor:pointer;font-size:.79rem;margin-top:.7rem;padding:.28rem;transition:color .2s;}
.expand-btn:hover{color:var(--primary-light);}

/* ÉPISODES */
.ep-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.65rem;margin-bottom:.85rem;}
.ep-header h3{font-size:.95rem;font-weight:700;}
.ep-controls{display:flex;gap:.32rem;align-items:center;flex-wrap:wrap;}
.ep-search{padding:.4rem .82rem;background:var(--bg-input);border:1px solid var(--border);border-radius:30px;color:var(--text);font-size:.79rem;width:168px;transition:var(--transition);}
.ep-search:focus{outline:none;border-color:var(--primary);}
.ep-pag-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.42rem;margin-bottom:.75rem;padding:.38rem .1rem;}
.ep-pag-btns{display:flex;gap:.26rem;flex-wrap:wrap;}
.ep-pg{padding:.28rem .62rem;background:var(--bg-hover);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font-size:.74rem;transition:var(--transition);}
.ep-pg:hover,.ep-pg.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.ep-pg:disabled{opacity:.32;cursor:not-allowed;}
.ep-pg-jump{display:flex;align-items:center;gap:.32rem;font-size:.74rem;color:var(--text-muted);}
.ep-pg-jump input{width:50px;padding:.26rem .42rem;background:var(--bg-hover);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.74rem;text-align:center;}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:.42rem;max-height:355px;overflow-y:auto;padding:.18rem;}
.ep-item{
  background:var(--bg-hover);padding:.46rem .28rem;text-align:center;
  border-radius:8px;cursor:pointer;font-size:.74rem;font-weight:600;
  border:1px solid var(--border);transition:var(--transition);
  position:relative;user-select:none;
}
.ep-item:hover{background:var(--primary);border-color:var(--primary);color:#fff;transform:translateY(-2px);}
.ep-item.watched{border-color:color-mix(in srgb,var(--primary) 55%,transparent);color:var(--primary);}
.ep-item.watched::after{content:'✓';position:absolute;top:2px;right:3px;font-size:.52rem;color:var(--primary);}
.ep-item.watched:hover::after{color:#fff;}

/* SOURCES STREAMING */
.stream-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.65rem;}
.stream-card{
  background:var(--bg-hover);border-radius:var(--radius-sm);
  padding:.8rem .95rem;border:1px solid var(--border);
  cursor:pointer;transition:var(--transition);text-align:center;
  text-decoration:none;color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:.38rem;
}
.stream-card:hover{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--bg-hover));transform:translateY(-2px);box-shadow:0 6px 18px var(--primary-glow);}
.stream-card .s-icon{font-size:1.5rem;}
.stream-card .s-name{font-size:.8rem;font-weight:700;}
.stream-card .s-tag{font-size:.63rem;color:var(--text-muted);background:var(--bg-card);padding:.08rem .42rem;border-radius:10px;border:1px solid var(--border);}
.stream-card:hover .s-tag{color:rgba(255,255,255,.65);}

/* RECOMMANDATIONS */
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:.9rem;}
.rel-card{background:var(--bg-hover);border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:var(--transition);}
.rel-card:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:var(--shadow-card);}
.rel-card img{width:100%;height:192px;object-fit:cover;display:block;transition:transform .35s;}
.rel-card:hover img{transform:scale(1.05);}
.rel-info{padding:.52rem .62rem;}
.rel-info h4{font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.17rem;font-weight:600;}
.rel-info p{font-size:.65rem;color:var(--text-muted);}

/* GALERIE SCREENSHOTS */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:.65rem;}
.gallery-img{width:100%;height:125px;object-fit:cover;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);transition:var(--transition);display:block;}
.gallery-img:hover{transform:scale(1.03);border-color:var(--primary);box-shadow:0 4px 12px var(--primary-glow);}

/* PERSONNAGES */
.chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.75rem;}
.char-card{background:var(--bg-hover);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);transition:var(--transition);cursor:default;}
.char-card:hover{border-color:var(--primary);transform:translateY(-2px);}
.char-card img{width:100%;height:160px;object-fit:cover;object-position:top;display:block;}
.char-info{padding:.5rem .6rem;}
.char-name{font-size:.76rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.char-role{font-size:.63rem;color:var(--primary);text-transform:uppercase;letter-spacing:.3px;margin-top:.1rem;}

/* STAFF */
.staff-list{display:flex;flex-direction:column;gap:.45rem;}
.staff-item{display:flex;align-items:center;gap:.7rem;padding:.55rem .7rem;background:var(--bg-hover);border-radius:var(--radius-sm);border:1px solid var(--border);}
.staff-img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--border);}
.staff-name{font-size:.82rem;font-weight:600;}
.staff-role{font-size:.68rem;color:var(--text-muted);}

/* STATISQUES DE LA PAGE */
.page-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:1.3rem;}
.page-stat{background:var(--bg-hover);border-radius:var(--radius-sm);padding:1rem;text-align:center;border:1px solid var(--border);transition:var(--transition);}
.page-stat:hover{border-color:var(--primary);transform:translateY(-2px);}
.page-stat-n{font-size:1.65rem;font-weight:900;color:var(--primary);line-height:1;}
.page-stat-l{font-size:.67rem;color:var(--text-muted);margin-top:.28rem;text-transform:uppercase;letter-spacing:.4px;}

/* TOAST */
#toast{
  position:fixed;bottom:26px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--bg-card);color:var(--text);
  border:1px solid var(--border);border-left:4px solid var(--primary);
  border-radius:var(--radius-sm);padding:.7rem 1.3rem;
  font-size:.8rem;min-width:230px;text-align:center;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;z-index:9999;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.loading,.error{text-align:center;padding:3.5rem;color:var(--text-muted);}
.error{color:var(--primary);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.loading{animation:pulse 1.5s infinite;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE */
@media(max-width:768px){
  .detail-hero{flex-direction:column;align-items:center;text-align:center;}
  .hero-poster{width:182px;}
  .stats-row{justify-content:center;}
  .action-row{justify-content:center;}
  .container{padding:1rem;}
  .ep-grid{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));}
  .info-grid{grid-template-columns:1fr;}
  .page-tabs{padding:.28rem .28rem 0;}
  .ptab{padding:.48rem .85rem;font-size:.77rem;}
}
@media(max-width:480px){
  .ep-pag-bar{flex-direction:column;align-items:flex-start;}
  .stream-grid{grid-template-columns:repeat(2,1fr);}
  .chars-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
}
  </style>
</head>

<header>
  <div class="hdr">
    <a href="index.html" class="home-link">← Accueil</a>
    <span class="hdr-title" id="hdrTitle">Chargement…</span>
    <div class="hdr-right">
      <button class="icon-btn" id="themeToggle" title="Changer le thème">🌙</button>
      <a href="profile.html" class="icon-btn" title="Mon profil" style="font-style:normal">👤</a>
    </div>
  </div>
</header>
<main class="container" id="mainCont">
  <div class="loading">⏳ Chargement des informations…</div>
</main>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════
   CONFIGURATION GLOBALE
══════════════════════════════════════════ */
const P     = new URLSearchParams(location.search);
const CID   = P.get('id');
const CTYPE = P.get('type') || 'anime';

const API   = 'https://api.jikan.moe/v4';
const ALIST = 'https://graphql.anilist.co';
const PROXY = 'https://corsproxy.io/?url=';

const PH = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 280'%3E%3Crect width='200' height='280' fill='%231a1a2e'/%3E%3Ctext x='100' y='145' text-anchor='middle' fill='%238888aa' font-size='12'%3ESans image%3C/text%3E%3C/svg%3E";
const AVA= "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Ccircle cx='40' cy='40' r='40' fill='%23252540'/%3E%3C/svg%3E";

// Corrections du nombre d'épisodes pour les séries longues
const EP_FIX = {
  21:1122, 1:220, 2:500, 3:366, 4:291, 5:131,
  6:87, 7:47, 8:55, 9:138, 10:293, 11:25,
  12:24, 13:25, 14:24, 15:12,
  38524:38, 40456:25, 48583:24, 51009:13, 52991:12,
  269:500, 1735:74, 457:74, 11061:366, 16498:25,
  40748:13, 50265:24, 51179:24, 52588:12, 53116:12
};

// 8 sources de streaming avec URL slug-based
const SOURCES = [
  {name:'AnimeSama',   icon:'🍥', tag:'VF/VOSTFR', url:(s,e,l)=>`https://animesama.com/catalogue/${s}/${l}/ep${e}/`},

function esc(s) {
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function slug(t) {
  return (t||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function getWatched() {
  return new Set(JSON.parse(localStorage.getItem('akrya_w_'+CID) || '[]'));

function markWatched(ep) {
  const w = getWatched(); w.add(ep);
  localStorage.setItem('akrya_w_'+CID, JSON.stringify([...w]));
  refreshEpClasses();
  // Sauvegarder aussi la progression dans Firestore
  if(currentUser && fbDb) {
    fbDb.collection('users').doc(currentUser.uid).set({
      [`progress.${CTYPE}.${CID}`]: ep,
      lastWatched: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true}).catch(() => {});
  }
}
function refreshEpClasses() {

/* ══ PAGINATION ÉPISODES ══ */
let epPage = 1, EP_PP = 60;
let allEps = [], filteredEps = [];

function buildEpPagination(total) {
  allEps = Array.from({length:total}, (_,i) => i+1);
  filteredEps = [...allEps];
  epPage = 1;
  renderEpPage();
}

function renderEpPage() {
  const label = CTYPE === 'anime' ? 'Ép.' : 'Ch.';
  const totalPages = Math.max(1, Math.ceil(filteredEps.length / EP_PP));
  const start = (epPage - 1) * EP_PP;
  const slice = filteredEps.slice(start, start + EP_PP);
  const watched = getWatched();

  const grid = document.getElementById('epGrid');
  if(grid) {
    grid.innerHTML = slice.map(n => `
      <div class="ep-item${watched.has(n) ? ' watched' : ''}" data-n="${n}"
        onclick="goWatch(${n})" title="${label} ${n}${watched.has(n) ? ' — vu ✓' : ''}">
        ${label} ${n}
      </div>`).join('');
  }

  const pag = document.getElementById('epPagBar'); if(!pag) return;
  const pages = [];
  for(let i = Math.max(1, epPage-2); i <= Math.min(totalPages, epPage+2); i++) pages.push(i);

  pag.innerHTML = `
    <div class="ep-pag-btns">
      <button class="ep-pg" onclick="goEpPage(1)" ${epPage===1?'disabled':''} title="Première page">«</button>
      <button class="ep-pg" onclick="goEpPage(${epPage-1})" ${epPage===1?'disabled':''}>◀</button>
      ${pages.map(p => `<button class="ep-pg${p===epPage?' active':''}" onclick="goEpPage(${p})">${p}</button>`).join('')}
      <button class="ep-pg" onclick="goEpPage(${epPage+1})" ${epPage===totalPages?'disabled':''}>▶</button>
      <button class="ep-pg" onclick="goEpPage(${totalPages})" ${epPage===totalPages?'disabled':''} title="Dernière page">»</button>
    </div>
    <span style="font-size:.73rem;color:var(--text-muted)">
      Page ${epPage}/${totalPages} · ${filteredEps.length} ${label.toLowerCase()}${filteredEps.length > 1 ? 's' : ''}
    </span>
    <div class="ep-pg-jump">
      <span>→</span>
      <input type="number" id="epJump" min="1" max="${totalPages}" value="${epPage}"
        onkeydown="if(event.key==='Enter')goEpPage(+this.value)">
      <button class="ep-pg" onclick="goEpPage(+document.getElementById('epJump').value)">OK</button>
    </div>`;
}

window.goEpPage = function(p) {
  const total = Math.max(1, Math.ceil(filteredEps.length / EP_PP));
  if(isNaN(p) || p < 1 || p > total) return;
  epPage = p; renderEpPage();
  document.getElementById('epGrid')?.scrollIntoView({behavior:'smooth', block:'nearest'});
};
window.goWatch = function(n) {
  markWatched(n);
  location.href = `watch.html?id=${CID}&type=${CTYPE}&ep=${n}`;
};

async function apiFetch(url) {
  try {
    const r = await fetch(url, {signal: AbortSignal.timeout(9000)});

  } catch(_) {}
  return fetch(PROXY + encodeURIComponent(url), {signal: AbortSignal.timeout(14000)});
}

/* ══ STATUS ══ */
function statusLabel(s) {
  return ({
    'Currently Airing':'🟢 En cours','Finished Airing':'✅ Terminé',
    'Not yet aired':'📅 À venir','On Hiatus':'⏸️ En pause',
    'Publishing':'🟢 En cours','Finished':'✅ Terminé','Discontinued':'❌ Annulé',
    'RELEASING':'🟢 En cours','FINISHED':'✅ Terminé','NOT_YET_RELEASED':'📅 À venir'
  })[s] || s || '—';
}
function statusCls(s) {
  if(['Currently Airing','Publishing','RELEASING'].includes(s)) return 'airing';
  if(['Finished Airing','Finished','FINISHED'].includes(s)) return 'finished';
  if(['On Hiatus'].includes(s)) return 'hiatus';
  return 'upcoming';
}

/* ══ SCORE RING SVG ══ */
function scoreRingHtml(score) {
  if(!score) return '';
  const pct = Math.min(score * 10, 100);
  const r = 27, circ = 2 * Math.PI * r;
  const dash = pct / 100 * circ;
  return `<div class="score-ring-wrap">
    <div class="score-ring">
      <svg width="66" height="66" viewBox="0 0 66 66">
        <circle cx="33" cy="33" r="${r}" fill="none" stroke="var(--border)" stroke-width="5"/>
        <circle cx="33" cy="33" r="${r}" fill="none" stroke="var(--primary)" stroke-width="5"
          stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/>
      </svg>
      <span class="score-ring-val">${score}</span>
    </div>
    <span class="score-ring-lbl">Score MAL</span>
  </div>`;
}

        <div style="display:flex;gap:.55rem;flex-wrap:wrap">
          <a href="watch.html?id=${CID}&type=${CTYPE}&ep=1" class="btn-primary">▶ Regarder ép. 1</a>
          ${lastEp > 1 ? `<a href="watch.html?id=${CID}&type=${CTYPE}&ep=${lastEp}" class="btn-sm">↩ Reprendre ép. ${lastEp}</a>` : ''}
          ${epCount > 1 ? `<a href="watch.html?id=${CID}&type=${CTYPE}&ep=${epCount}" class="btn-sm">→ Dernier ép. (${epCount})</a>` : ''}
        </div>
      </div>`;

  // ─── PERSONNAGES ─────────────────────────────
  } else if(activeTab === 'characters') {
    section.innerHTML = `<div id="charsGrid" class="chars-grid"><div class="loading">⏳ Chargement…</div></div>`;
    loadCharacters();

  // ─── RECOMMANDATIONS ─────────────────────────
  } else if(activeTab === 'related') {
    section.innerHTML = `<div id="relatedGrid" class="related-grid"><div class="loading">⏳ Chargement…</div></div>`;
    loadRelated(CTYPE === 'webtoon' ? 'manga' : CTYPE);
  }
}

/* ══ RENDER HERO ══ */
function renderDetail(d) {
  itemData = d;
  const isAnime = CTYPE === 'anime';
  const title   = d.title || 'Sans titre';
  const titleEN = d.title_english || d.title_japanese || '';
  animeSlug = slug(title);

  const image   = d.images?.jpg?.large_image_url || d.images?.jpg?.image_url || PH;
  const score   = d.score;
  const rank    = d.rank;
  const st      = statusLabel(d.status);
  const stCls   = statusCls(d.status);
  epCount       = isAnime ? (EP_FIX[CID] || d.episodes || 0) : (d.chapters || 0);
  const broadcast = d.broadcast?.string || (d.broadcast?.day && d.broadcast?.time ? `${d.broadcast.day} à ${d.broadcast.time} JST` : null);
  const nextAir   = d.broadcast?.day && d.status === 'Currently Airing'
    ? `📺 Prochain épisode chaque <strong>${d.broadcast.day}</strong>${d.broadcast.time ? ' à ' + d.broadcast.time : ''}` : null;

  // SEO dynamique
  document.getElementById('pageTitle').textContent   = `${title} — Akrya`;
  document.getElementById('hdrTitle').textContent    = title;
  document.getElementById('metaDesc').setAttribute('content', `${title} — ${st} — ${epCount} ${isAnime?'épisodes':'chapitres'} — Akrya`);
  document.getElementById('metaOgTitle').setAttribute('content', title);
  document.getElementById('metaOgImg').setAttribute('content', image);

  document.getElementById('mainCont').innerHTML = `
    <!-- HERO -->
    <div class="detail-hero">
      <div class="hero-poster">
        <img src="${image}" alt="${esc(title)}" onerror="this.src='${PH}'" loading="lazy">
        ${score ? `<div class="poster-score">⭐ ${score}</div>` : ''}
        <div class="poster-status ${stCls}">${st}</div>
      </div>
      <div class="hero-info">
        <h1>${esc(title)}</h1>
        ${titleEN ? `<h2>${esc(titleEN)}</h2>` : ''}
        <div class="stats-row">
          ${score ? scoreRingHtml(score) : ''}
          ${rank  ? `<span class="stat-pill">📊 Rang #${rank.toLocaleString('fr-FR')}</span>` : ''}
          <span class="stat-pill">${isAnime?'📺':'📚'} ${epCount||'?'} ${isAnime?'ép.':'ch.'}</span>
          ${d.members   ? `<span class="stat-pill">👥 ${(d.members||0).toLocaleString('fr-FR')} membres</span>` : ''}
          ${d.favorites ? `<span class="stat-pill">❤️ ${(d.favorites||0).toLocaleString('fr-FR')} favoris</span>` : ''}
          ${d.season    ? `<span class="stat-pill">📆 ${d.season} ${d.year||''}</span>` : ''}
          ${d.rating    ? `<span class="stat-pill">🔞 ${esc(d.rating)}</span>` : ''}
          ${d.type      ? `<span class="stat-pill">${esc(d.type)}</span>` : ''}
        </div>
        ${broadcast ? `<div class="next-ep-banner">🕒 ${esc(broadcast)}</div>` : ''}
        ${nextAir   ? `<div class="next-ep-banner">${nextAir}</div>` : ''}
        <div class="action-row">
          ${epCount > 0 ? `<a href="watch.html?id=${CID}&type=${CTYPE}&ep=1" class="btn-primary">▶ ${isAnime?'Regarder ép. 1':'Lire chap. 1'}</a>` : ''}
          ${epCount > 1 ? `<a href="watch.html?id=${CID}&type=${CTYPE}&ep=${epCount}" class="btn-sm">→ Ép. ${epCount}</a>` : ''}
          <button class="btn-outline" id="favBtn" onclick="toggleFav('${CID}','${esc(title.replace(/'/g,"\\'"))}','${image}',${score||0})">
            ${isFav(CID) ? '❤️ Dans mes favoris' : '🤍 Favoris'}
          </button>
          ${d.url ? `<a href="${d.url}" target="_blank" rel="noopener" class="btn-sm">MyAnimeList ↗</a>` : ''}
        </div>
      </div>
    </div>

    <!-- ONGLETS -->
    <div class="page-tabs">
      <button class="ptab active" data-tab="info"       onclick="switchTab('info')">📋 Infos</button>
      ${epCount > 0 ? `<button class="ptab" data-tab="episodes" onclick="switchTab('episodes')">${isAnime?'📺 Épisodes':'📚 Chapitres'}<span class="tab-badge">${epCount}</span></button>` : ''}
      <button class="ptab" data-tab="watch"      onclick="switchTab('watch')">▶ Regarder</button>
      <button class="ptab" data-tab="characters" onclick="switchTab('characters')">👥 Personnages</button>
      <button class="ptab" data-tab="related"    onclick="switchTab('related')">🔗 Recommandations</button>
    </div>
    <div class="section" id="tabSection"></div>`;

  renderActiveTab();
}

/* ══ PERSONNAGES (Jikan) ══ */
async function loadCharacters() {
  const cat = CTYPE === 'webtoon' ? 'manga' : CTYPE;
  try {
    const r = await apiFetch(`${API}/${cat}/${CID}/characters`);
    if(!r.ok) throw new Error();
    const d = await r.json();
    const chars = (d.data || []).slice(0, 20);
    const grid = document.getElementById('charsGrid');
    if(!grid) return;
    if(!chars.length) {
      grid.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Aucun personnage disponible.</p>';
      return;
    }
    grid.innerHTML = chars.map(c => {
      const ch = c.character;
      const va = (c.voice_actors || []).find(v => v.language === 'Japanese');
      return `<div class="char-card" title="${esc(ch.name)}">
        <img src="${ch.images?.jpg?.image_url || AVA}" onerror="this.src='${AVA}'" loading="lazy" alt="${esc(ch.name)}">
        <div class="char-info">
          <div class="char-name">${esc(ch.name)}</div>
          <div class="char-role">${esc(c.role)}</div>
          ${va ? `<div style="font-size:.6rem;color:var(--text-muted);margin-top:.15rem">🎙️ ${esc(va.person.name)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  } catch(_) {
    const grid = document.getElementById('charsGrid');
    if(grid) grid.innerHTML = '<p style="color:var(--text-muted);font-size:.83rem">Erreur de chargement des personnages.</p>';
  }
}

/* ══ RECOMMANDATIONS ══ */
async function loadRelated(cat) {
  try {
    const r = await apiFetch(`${API}/${cat}/${CID}/recommendations`);
    if(!r.ok) throw new Error();
    const d = await r.json();
    const recs = (d.data || []).slice(0, 12);
    const grid = document.getElementById('relatedGrid');
    if(!grid) return;
    if(!recs.length) {
      grid.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Aucune recommandation disponible.</p>';
      return;
    }
    grid.innerHTML = recs.map(rec => {
      const e = rec.entry;
      return `<div class="rel-card" onclick="location.href='detail.html?id=${e.mal_id}&type=${CTYPE}'">
        <img src="${e.images?.jpg?.image_url || PH}" onerror="this.src='${PH}'" loading="lazy" alt="${esc(e.title)}">
        <div class="rel-info">
          <h4 title="${esc(e.title)}">${esc(e.title?.length > 22 ? e.title.slice(0,20) + '…' : e.title)}</h4>
          <p>👍 ${rec.votes} vote${rec.votes > 1 ? 's' : ''}</p>
        </div>
      </div>`;
    }).join('');
  } catch(_) {
    const grid = document.getElementById('relatedGrid');
    if(grid) grid.innerHTML = '<p style="color:var(--text-muted);font-size:.83rem">Erreur de chargement.</p>';
  }
}

/* ══ CHARGEMENT PRINCIPAL ══ */
async function loadDetail() {
  if(!CID) {
    document.getElementById('mainCont').innerHTML =
      '<div class="error">❌ Aucun ID fourni dans l\'URL.<br><a href="index.html" style="color:var(--primary)">← Retour à l\'accueil</a></div>';
    return;
  }

  // Webtoon → recherche dans manga (Jikan)
  const cat = CTYPE === 'webtoon' ? 'manga' : CTYPE;

  try {
    // /full : une seule requête qui retourne TOUT (studios, themes, external, streaming, trailer, etc.)
    const r = await apiFetch(`${API}/${cat}/${CID}/full`);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if(!d.data) throw new Error('Données vides');
    renderDetail(d.data);
  } catch(e) {
    document.getElementById('mainCont').innerHTML = `
      <div class="error">
        ❌ Erreur de chargement<br>
        <small style="display:block;margin:.4rem 0;color:var(--text-muted)">${esc(e.message)}</small>
        <button onclick="loadDetail()" style="margin-top:.8rem;padding:.5rem 1.2rem;background:var(--primary);border:none;border-radius:8px;color:#fff;cursor:pointer;font-weight:600">🔄 Réessayer</button>
        <a href="index.html" style="margin-left:.8rem;color:var(--primary);font-size:.85rem">← Accueil</a>
      </div>`;
  }
}

loadDetail();
</script>
